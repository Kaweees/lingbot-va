[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LingBot_VA"
version = "0.0.0"
description = "LingBot-VA: A Pragmatic VA Foundation Model"
authors = [{ name = "Robbyant Team", email = "fengchang.ll@antgroup.com" }]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.9.0",
    "diffusers==0.36.0",
    "transformers==4.55.2",
    "accelerate",
    "einops",
    "websockets",
    "msgpack",
    "opencv-python",
    "matplotlib",
    "ftfy",
    "safetensors",
    "Pillow",
    "scipy",
    "tqdm",
    "imageio[ffmpeg]",
    "easydict",
    "numpy>=1.26.4,<2",
]

[project.optional-dependencies]
cuda12 = [
    "torch==2.9.0",
    "flash-attn-4==4.0.0b37; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cuda13 = [
    "torch==2.9.0",
    "flash-attn-4[cu13]==4.0.0b37; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
dev = ["pytest", "black", "flake8", "isort", "mypy"]

[project.urls]
homepage = "https://github.com/Robbyant"
documentation = "https://github.com/Robbyant"
repository = "https://github.com/Robbyant"
huggingface = "https://github.com/Robbyant"
modelscope = "https://github.com/Robbyant"
discord = "https://github.com/Robbyant"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["wan_va*"]

[tool.setuptools.package-data]
"wan_va" = ["**/*.py"]

[tool.uv]
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda12" },
    { index = "pytorch-cu130", extra = "cuda13" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
